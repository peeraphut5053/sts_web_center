<body class="sub-import-page">

    <style>
        body.sub-import-page {
            min-height: 100vh;
            margin: 0;
            background: #eef2f5;
            color: #23313f;
            font-family: "Tahoma", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .sub-import-shell {
            padding: 24px;
        }

        .sub-import-panel {
            position: sticky;
            top: 0;
            z-index: 50;
            border: 1px solid #d8e0e7;
            border-top: 4px solid #2f7f75;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 14px 30px rgba(35, 49, 63, .12);
        }

        .sub-import-header {
            display: table;
            width: 100%;
            padding: 16px 18px 12px;
            border-bottom: 1px solid #e3e8ed;
        }

        .sub-import-title,
        .sub-import-meta {
            display: table-cell;
            vertical-align: middle;
        }

        .sub-import-title h1 {
            margin: 0;
            color: #1f3f4a;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .sub-import-title span {
            display: block;
            margin-top: 3px;
            color: #73808c;
            font-size: 12px;
        }

        .sub-import-meta {
            text-align: right;
        }

        .status-pill {
            display: inline-block;
            min-width: 74px;
            padding: 7px 12px;
            border: 1px solid #cad7df;
            border-radius: 4px;
            background: #f7fafb;
            color: #425160;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .sub-step-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
            padding: 14px 18px 18px;
        }

        .sub-step {
            display: table-cell;
            position: relative;
            padding-right: 16px;
            vertical-align: top;
        }

        .sub-step:last-child {
            padding-right: 0;
        }

        .sub-step-card {
            min-height: 116px;
            padding: 14px;
            border: 1px solid #dce5eb;
            border-radius: 6px;
            background: #fbfcfd;
        }

        .sub-step-card.active {
            border-color: #47a79b;
            background: #f4fbfa;
        }

        .step-kicker {
            margin-bottom: 10px;
            color: #2f7f75;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .step-title {
            margin: 0 0 12px;
            color: #263847;
            font-size: 15px;
            font-weight: 700;
        }

        .step-control-row {
            display: table;
            width: 100%;
        }

        .step-control,
        .step-result {
            display: table-cell;
            vertical-align: middle;
        }

        .step-result {
            width: 38px;
            padding-left: 8px;
            color: #2f7f75;
            text-align: center;
        }

        .step-result .glyphicon-refresh {
            animation: sub-import-spin .8s linear infinite;
        }

        .file-control {
            position: relative;
        }

        .file-control input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .file-trigger {
            display: block;
            width: 100%;
            margin: 0;
            padding: 9px 12px;
            border: 1px solid #b8c7d1;
            border-radius: 4px;
            background: #ffffff;
            color: #314555;
            font-weight: 400;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-trigger:hover,
        .file-trigger:focus {
            border-color: #2f7f75;
            color: #1f665d;
        }

        .file-trigger .glyphicon,
        #btnImport .glyphicon {
            margin-right: 6px;
        }

        .form-control {
            height: 40px;
            border-color: #b8c7d1;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #2f7f75;
            box-shadow: 0 0 0 2px rgba(47, 127, 117, .14);
        }

        #btnImport {
            width: 100%;
            height: 40px;
            border-color: #2f7f75;
            background: #2f7f75;
            font-weight: 700;
        }

        #btnImport:hover,
        #btnImport:focus {
            border-color: #266c64;
            background: #266c64;
        }

        #btnImport[disabled] {
            border-color: #b7c1c9;
            background: #b7c1c9;
            opacity: 1;
        }

        .preview-wrap {
            margin-top: 22px;
            border: 1px solid #d8e0e7;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 10px 24px rgba(35, 49, 63, .08);
            overflow: hidden;
        }

        .preview-toolbar {
            display: table;
            width: 100%;
            padding: 13px 16px;
            border-bottom: 1px solid #e3e8ed;
            background: #f8fafb;
        }

        .preview-title,
        .preview-hint {
            display: table-cell;
            vertical-align: middle;
        }

        .preview-title {
            color: #253847;
            font-size: 15px;
            font-weight: 700;
        }

        .preview-hint {
            color: #73808c;
            font-size: 12px;
            text-align: right;
        }

        #ReaderExcel {
            min-height: 280px;
            max-height: calc(100vh - 260px);
            overflow: auto;
            background: #ffffff;
        }

        .empty-preview {
            padding: 70px 20px;
            color: #7a8792;
            text-align: center;
        }

        .empty-preview .glyphicon {
            display: block;
            margin-bottom: 12px;
            color: #9aa9b4;
            font-size: 34px;
        }

        #ReaderExcel table {
            margin-bottom: 0;
            white-space: nowrap;
        }

        #ReaderExcel table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid #cad6de;
            background: #263847;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
        }

        #ReaderExcel table tbody td {
            vertical-align: middle;
            font-size: 12px;
        }

        #ReaderExcel table tbody tr:hover td {
            background: #f2f8f7;
        }

        #DivResult {
            margin: 12px 0 0;
        }

        .import-result {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 4px;
            background: #f1f6f8;
            color: #405160;
            font-weight: 700;
        }

        @media (max-width: 991px) {
            .sub-import-shell {
                padding: 14px;
            }

            .sub-import-panel {
                position: static;
            }

            .sub-import-title,
            .sub-import-meta,
            .sub-step,
            .preview-title,
            .preview-hint {
                display: block;
                width: 100%;
                text-align: left;
            }

            .sub-import-meta,
            .preview-hint {
                margin-top: 10px;
            }

            .sub-step-grid {
                display: block;
            }

            .sub-step {
                padding: 0 0 12px;
            }

            #ReaderExcel {
                max-height: none;
            }
        }

        @keyframes sub-import-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

        <script type="text/javascript">

            var loadingDiv = "<span class='glyphicon glyphicon-refresh'></span>";
            function setFileLabel(fileName) {
                $("#fileLabel")
                    .empty()
                    .append($("<span>").addClass("glyphicon glyphicon-folder-open"))
                    .append(document.createTextNode(" " + (fileName || "Browse workbook")));
            }

            $('#files').change(function (e) {
                $('#ReaderExcel').empty();
                $(".colResultBrowse").html(loadingDiv);
                setFileLabel(e.target.files[0] ? e.target.files[0].name : "");
                $("#colResultButtonMain").html("No rows");
                $("#btnImport").attr("disabled", true);
                $("#sheet_name").attr("disabled", true);
                var sheet_name = $("#sheet_name").val();
                $('#ReaderExcel').empty();
                $("#FilePath").html();
                var reader = new FileReader();
                reader.readAsArrayBuffer(e.target.files[0]);
                reader.onload = function (e) {
                    var data = new Uint8Array(reader.result);
                    var wb = XLSX.read(data, { type: 'array' });
                    var sheetcount = wb.SheetNames.length;
                    var i = 0;
                    $("#sheet_name").empty();
                    $("#sheet_name").append('<option value="">... Please select ...</option>');
                    for (i = 0; i < sheetcount; i++) {
                        $("#sheet_name").append('<option value="' + wb.SheetNames[i] + '">' + wb.SheetNames[i] + '</option>');

                    $(".colResultBrowse").html("<span class='glyphicon glyphicon-ok'></span>");
