<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
<title>Import Excel (Zinc)</title>
<link rel='stylesheet' href='../../css/bootstrap.min.css'>
</head>

<body class="sub-import-page">

    <style>
        body.sub-import-page {
            min-height: 100vh;
            margin: 0;
            background: #eef2f5;
            color: #23313f;
            font-family: "Tahoma", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .sub-import-shell {
            padding: 24px;
        }

        .sub-import-panel {
            position: sticky;
            top: 0;
            z-index: 50;
            border: 1px solid #d8e0e7;
            border-top: 4px solid #2f7f75;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 14px 30px rgba(35, 49, 63, .12);
        }

        .sub-import-header {
            display: table;
            width: 100%;
            padding: 16px 18px 12px;
            border-bottom: 1px solid #e3e8ed;
        }

        .sub-import-title,
        .sub-import-meta {
            display: table-cell;
            vertical-align: middle;
        }

        .sub-import-title h1 {
            margin: 0;
            color: #1f3f4a;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .sub-import-title span {
            display: block;
            margin-top: 3px;
            color: #73808c;
            font-size: 12px;
        }

        .sub-import-meta {
            text-align: right;
        }

        .status-pill {
            display: inline-block;
            min-width: 74px;
            padding: 7px 12px;
            border: 1px solid #cad7df;
            border-radius: 4px;
            background: #f7fafb;
            color: #425160;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .sub-step-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
            padding: 14px 18px 18px;
        }

        .sub-step {
            display: table-cell;
            position: relative;
            padding-right: 16px;
            vertical-align: top;
        }

        .sub-step:last-child {
            padding-right: 0;
        }

        .sub-step-card {
            min-height: 116px;
            padding: 14px;
            border: 1px solid #dce5eb;
            border-radius: 6px;
            background: #fbfcfd;
        }

        .sub-step-card.active {
            border-color: #47a79b;
            background: #f4fbfa;
        }

        .step-kicker {
            margin-bottom: 10px;
            color: #2f7f75;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .step-title {
            margin: 0 0 12px;
            color: #263847;
            font-size: 15px;
            font-weight: 700;
        }

        .step-control-row {
            display: table;
            width: 100%;
        }

        .step-control,
        .step-result {
            display: table-cell;
            vertical-align: middle;
        }

        .step-result {
            width: 38px;
            padding-left: 8px;
            color: #2f7f75;
            text-align: center;
        }

        .step-result .glyphicon-refresh {
            animation: sub-import-spin .8s linear infinite;
        }

        .file-control {
            position: relative;
        }

        .file-control input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .file-trigger {
            display: block;
            width: 100%;
            margin: 0;
            padding: 9px 12px;
            border: 1px solid #b8c7d1;
            border-radius: 4px;
            background: #ffffff;
            color: #314555;
            font-weight: 400;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-trigger:hover,
        .file-trigger:focus {
            border-color: #2f7f75;
            color: #1f665d;
        }

        .file-trigger .glyphicon,
        #btnImport .glyphicon {
            margin-right: 6px;
        }

        .form-control {
            height: 40px;
            border-color: #b8c7d1;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #2f7f75;
            box-shadow: 0 0 0 2px rgba(47, 127, 117, .14);
        }

        #btnImport {
            width: 100%;
            height: 40px;
            border-color: #2f7f75;
            background: #2f7f75;
            font-weight: 700;
        }

        #btnImport:hover,
        #btnImport:focus {
            border-color: #266c64;
            background: #266c64;
        }

        #btnImport[disabled] {
            border-color: #b7c1c9;
            background: #b7c1c9;
            opacity: 1;
        }

        .preview-wrap {
            margin-top: 22px;
            border: 1px solid #d8e0e7;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 10px 24px rgba(35, 49, 63, .08);
            overflow: hidden;
        }

        .preview-toolbar {
            display: table;
            width: 100%;
            padding: 13px 16px;
            border-bottom: 1px solid #e3e8ed;
            background: #f8fafb;
        }

        .preview-title,
        .preview-hint {
            display: table-cell;
            vertical-align: middle;
        }

        .preview-title {
            color: #253847;
            font-size: 15px;
            font-weight: 700;
        }

        .preview-hint {
            color: #73808c;
            font-size: 12px;
            text-align: right;
        }

        #ReaderExcel {
            min-height: 280px;
            max-height: calc(100vh - 260px);
            overflow: auto;
            background: #ffffff;
        }

        .empty-preview {
            padding: 70px 20px;
            color: #7a8792;
            text-align: center;
        }

        .empty-preview .glyphicon {
            display: block;
            margin-bottom: 12px;
            color: #9aa9b4;
            font-size: 34px;
        }

        #ReaderExcel table {
            margin-bottom: 0;
            white-space: nowrap;
        }

        #ReaderExcel table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid #cad6de;
            background: #263847;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
        }

        #ReaderExcel table tbody td {
            vertical-align: middle;
            font-size: 12px;
        }

        #ReaderExcel table tbody tr:hover td {
            background: #f2f8f7;
        }

        #DivResult {
            margin: 12px 0 0;
        }

        .import-result {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 4px;
            background: #f1f6f8;
            color: #405160;
            font-weight: 700;
        }

        @media (max-width: 991px) {
            .sub-import-shell {
                padding: 14px;
            }

            .sub-import-panel {
                position: static;
            }

            .sub-import-title,
            .sub-import-meta,
            .sub-step,
            .preview-title,
            .preview-hint {
                display: block;
                width: 100%;
                text-align: left;
            }

            .sub-import-meta,
            .preview-hint {
                margin-top: 10px;
            }

            .sub-step-grid {
                display: block;
            }

            .sub-step {
                padding: 0 0 12px;
            }

            #ReaderExcel {
                max-height: none;
            }
        }

        @keyframes sub-import-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <input type='hidden' id='hdfStsIdPrefix' value="">

    <div class="sub-import-shell">
        <div class="sub-import-panel">
            <div class="sub-import-header">
                <div class="sub-import-title">
                    <h1>ZINC Import</h1>
                    <span>Upload an Excel workbook, choose a sheet, review data, then import.</span>
                </div>
                <div class="sub-import-meta">
                    <span class="status-pill" id="colResultButtonMain">No rows</span>
                </div>
            </div>

            <div class="sub-step-grid">
                <div class="sub-step">
                    <div class="sub-step-card active">
                        <div class="step-kicker">Step 1</div>
                        <h2 class="step-title">Choose Excel file</h2>
                        <div class="step-control-row">
                            <div class="step-control">
                                <div class="file-control">
                                    <input type="file" id="files"
                                        accept="application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                                    <label class="file-trigger" for="files" id="fileLabel">
                                        <span class="glyphicon glyphicon-folder-open"></span>
                                         เลือกไฟล์ Excel 
                                    </label>
                                </div>
                            </div>
                            <div class="step-result colResultBrowse"></div>
                        </div>
                    </div>
                </div>

                <div class="sub-step">
                    <div class="sub-step-card">
                        <div class="step-kicker">Step 2</div>
                        <h2 class="step-title">Select sheet</h2>
                        <div class="step-control-row">
                            <div class="step-control">
                                <select class='form-control' id='sheet_name' disabled>
                                    <option value="">... Please select ...</option>
                                </select>
                            </div>
                            <div class="step-result colResultSheet"></div>
                        </div>
                    </div>
                </div>

                <div class="sub-step">
                    <div class="sub-step-card">
                        <div class="step-kicker">Step 3</div>
                        <h2 class="step-title">Import reviewed data</h2>
                        <button class="btn btn-success" id="btnImport" disabled>
                            <span class="glyphicon glyphicon-download-alt"></span>
                            Import
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id='DivResult' class='text-center'></div>

        <div class="preview-wrap">
            <div class="preview-toolbar">
                <div class="preview-title">Excel Preview</div>
                <div class="preview-hint">Review workbook rows before importing.</div>
            </div>
            <div id="ReaderExcel">
                <div class="empty-preview">
                    <span class="glyphicon glyphicon-list-alt"></span>
                    Select a workbook and sheet to preview data.
                </div>
            </div>
        </div>
    </div>

    <div class="row text-center">
        <script type='text/javascript' src='../../js/jquery.js'></script>
        <script type='text/javascript' src='../../js/xlsx.core.min.js'></script>
        <script type='text/javascript' src='../../js/xlsx.full.min.js'></script>
        <script type="text/javascript">

            var loadingDiv = "<span class='glyphicon glyphicon-refresh'></span>";
            function setFileLabel(fileName) {
                $("#fileLabel")
                    .empty()
                    .append($("<span>").addClass("glyphicon glyphicon-folder-open"))
                    .append(document.createTextNode(" " + (fileName || "Browse workbook")));
            }

            $('#files').change(function (e) {
                $('#ReaderExcel').empty();
                $(".colResultBrowse").html(loadingDiv);
                setFileLabel(e.target.files[0] ? e.target.files[0].name : "");
                $("#colResultButtonMain").html("No rows");
                $("#btnImport").attr("disabled", true);
                $("#sheet_name").attr("disabled", true);
                var sheet_name = $("#sheet_name").val();
                $('#ReaderExcel').empty();
                $("#FilePath").html();
                var reader = new FileReader();
                reader.readAsArrayBuffer(e.target.files[0]);
                reader.onload = function (e) {
                    var data = new Uint8Array(reader.result);
                    var wb = XLSX.read(data, { type: 'array' });
                    var sheetcount = wb.SheetNames.length;
                    var i = 0;
                    $("#sheet_name").empty();
                    $("#sheet_name").append('<option value="">... Please select ...</option>');
                    for (i = 0; i < sheetcount; i++) {
                        $("#sheet_name").append('<option value="' + wb.SheetNames[i] + '">' + wb.SheetNames[i] + '</option>');
                    }
                    $(".colResultBrowse").html("<span class='glyphicon glyphicon-ok'></span>");
                    $("#sheet_name").removeAttr("disabled");
                }
            });

            $("#sheet_name").change(function () {
                $(".colResultSheet").html(loadingDiv);
                var files_input = document.getElementById("files");
                var file = files_input.files[0];

                if (!file) {
                    $.alert({
                        title: 'Can not import excel file !',
                        content: "Please select excel file"
                    });
                    return false;
                }
                var sheet_name = $("#sheet_name").val();
                var file_name = $('#files').val().replace(/C:\\fakepath\\/i, '');
                $("#tmpXlsSheet").val(sheet_name);
                $("#tmpXlsFile").val(file_name);
                console.log();
                var reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    var data = new Uint8Array(reader.result);
                    try {
                        var wb = XLSX.read(data, { type: 'array' });
                        var htmlstr = XLSX.write(wb, { sheet: sheet_name, type: 'string', bookType: 'html' });
                        // how to add font to exce
                        $('#ReaderExcel').empty();
                        $('#ReaderExcel')[0].innerHTML += htmlstr;
                        $('#ReaderExcel table').addClass('table table-striped table-bordered table-condensed');
                        //========== remove head =========
                        $('table tbody tr:eq(0)').remove();

                        //=========add nre head =========
                        $('table').prepend("<thead>  <th>sts_Pb</th> <th>sts_Al</th> <th>sts_Cd</th> <th>sts_Fe</th> <th>sts_Cu</th> <th>sts_Zn</th> <th>Test_result</th> <th>Date_rec</th> <th>Date_test</th> <th>LeadTime</th> <th>remark</th> </tr></thead>");
                        $('table thead').find('tr').each(function () {
                        });
                        var x = 0;
                        var i = 0;
                        var CountTr = $("tbody tr").length;
                        var LastStsId = $('#LastStsId').text().trim();
                        var StsNo = $('#StsNo').text().trim();
                        for (i = 0; i < CountTr; i++) {
                            x++;
                            $('table tbody tr:eq(' + i + ') ').find('td:eq(0)').text();
                        }
                        $(".colResultSheet").html("<span class='glyphicon glyphicon-ok'></span>");
                        $("#colResultButtonMain").html(CountTr + ' Rows');
                        $("#btnImport").removeAttr("disabled");
                    } catch (err) {
                        alert(err);
                        $(".colResultSheet").html("");
                    }
                }
            });
            function pad(str, max) {
                str = str.toString();
                return str.length < max ? pad("0" + str, max) : str;
            }
            $("#btnImport").click(function () {
                if (confirm('Do you want to Import data ? ') == true) {
                    PackDataToArrayAndSave();
                }
            });

        function PackDataToArrayAndSave() {
            var i = 0;
            var load = "InsertExcelZinc";

            var sts_Pb = [];
            var sts_Al = [];
            var sts_Cd = [];
            var sts_Fe = [];
            var sts_Cu = [];
            var sts_Zn = [];
            var Test_result = [];
            var Date_rec = [];
            var Date_test = [];
            var LeadTime = [];
            var remark = [];

            var CountItem = 0;

            $("tbody tr").each(function () {
                if (i >= 0) {
                    sts_Pb.push($(this).find('td:eq(0)').text());
                    sts_Al.push($(this).find('td:eq(1)').text());
                    sts_Cd.push($(this).find('td:eq(2)').text());
                    sts_Fe.push($(this).find('td:eq(3)').text());
                    sts_Cu.push($(this).find('td:eq(4)').text());
                    sts_Zn.push($(this).find('td:eq(5)').text());
                    Test_result.push($(this).find('td:eq(6)').text());
                    Date_rec.push($(this).find('td:eq(7)').text());
                    Date_test.push($(this).find('td:eq(8)').text());
                    LeadTime.push($(this).find('td:eq(9)').text());
                    remark.push($(this).find('td:eq(10)').text());
                    CountItem++;
                }
                i++;
            });
          
            $.ajax({
                url: "../../module/APP_Qc_TestLab/data.php",
                type: 'POST',
                dataType: 'text',
                data: {
                    load : load,                
                    sts_Pb : sts_Pb,
                    sts_Al : sts_Al,
                    sts_Cd : sts_Cd,
                    sts_Fe : sts_Fe,
                    sts_Cu : sts_Cu,
                    sts_Zn : sts_Zn,
                    Test_result : Test_result,
                    Date_rec : Date_rec,
                    Date_test : Date_test,
                    LeadTime : LeadTime,
                    remark : remark,
                },
                success: function (data) {
                    if(data!=''){
						// alert(`complete ${(data.length)} rows`);
                        alert(`complete`);
						// location.reload();
					}
                },
                error: function (xhr, status, error) {
                    var err = eval("(" + xhr.responseText + ")");
                    $("#colResultButtonMain").html("Error!");
                    $("#btnImport").attr("disabled", true);

                },
            });
        }
     
        </script>
    </div>
</body>

</html>
