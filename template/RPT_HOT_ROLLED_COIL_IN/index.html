<script type="text/javascript">
    var g_reportData = [];

    // PDF Fonts configuration
    pdfMake.fonts = {
        THSarabunNew: {
            normal: 'THSarabunNew.ttf',
            bold: 'THSarabunNew Bold.ttf',
            italics: 'THSarabunNew-Italic.ttf',
            bolditalics: 'THSarabunNew-BoldItalic.ttf'
        }
    };

    $(document).ready(function () {
        $("#txtFromDate, #txtToDate").datepicker({
            dateFormat: 'yy-mm-dd',
        });

        $("#btnSearch").click(function () {
            ReportSearch();
        });

        $(".txt-filter").on("keypress", function (e) {
            if (e.keyCode == 13) {
                ReportSearch();
                return false;
            }
        });

        RenderTable([]);
    });

    function GetToday() {
        var d = new Date();
        var month = '' + (d.getMonth() + 1);
        var day = '' + d.getDate();
        var year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }

    function ResetFilter() {
        $("#txtFromDate").val("2026-01-01");
        $("#txtToDate").val(GetToday());
        $("#sno").val("");
    }

    function FormatThaiShortDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        var day = String(d.getDate()).padStart(2, "0");
        var month = String(d.getMonth() + 1).padStart(2, "0");
        var yearBE = (d.getFullYear() + 543) % 100;
        return day + "/" + month + "/" + yearBE;
    }

    function GetThaiDateRangeText(startStr, endStr) {
        var thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];
        if (!startStr && !endStr) return "";
        var d1 = startStr ? new Date(startStr) : null;
        var d2 = endStr ? new Date(endStr) : null;

        if (d1 && !isNaN(d1.getTime()) && d2 && !isNaN(d2.getTime())) {
            var y1 = d1.getFullYear() + 543;
            var y2 = d2.getFullYear() + 543;
            if (d1.getMonth() === d2.getMonth() && y1 === y2) {
                return "วันที่ " + d1.getDate() + " - " + d2.getDate() + " " + thaiMonths[d2.getMonth()] + " " + y2;
            }
            return "วันที่ " + d1.getDate() + " " + thaiMonths[d1.getMonth()] + " " + y1 + " - " + d2.getDate() + " " + thaiMonths[d2.getMonth()] + " " + y2;
        } else if (d1 && !isNaN(d1.getTime())) {
            return "ตั้งแต่วันที่ " + d1.getDate() + " " + thaiMonths[d1.getMonth()] + " " + (d1.getFullYear() + 543);
        } else if (d2 && !isNaN(d2.getTime())) {
            return "ถึงวันที่ " + d2.getDate() + " " + thaiMonths[d2.getMonth()] + " " + (d2.getFullYear() + 543);
        }
        return "";
    }

    function ReportSearch() {
        var txtFromDate = $("#txtFromDate").val().trim();
        var txtToDate = $("#txtToDate").val().trim();
        var sno = $("#sno").val().trim();

        $.ajax({
            type: 'POST',
            url: "./module/RPT_HOT_ROLLED_COIL_IN/data.php",
            dataType: 'json',
            beforeSend: function () {
                $("#btnSearch").html("<i class='fa fa-spinner fa-spin'></i>&nbsp;กำลังค้นหา...");
            },
            data: {
                load: "pipe_in",
                txtFromDate: txtFromDate,
                txtToDate: txtToDate,
                sno: sno
            },
            success: function (data) {
                g_reportData = data || [];
                RenderTable(g_reportData);
                $("#btnSearch").html("<i class='fa fa-search'></i>&nbsp;ค้นหา");
            },
            error: function (e) {
                console.log("Error loading data:", e);
                $("#btnSearch").html("<i class='fa fa-search'></i>&nbsp;ค้นหา");
                $.alert("เกิดข้อผิดพลาดในการดึงข้อมูลจากระบบ");
            }
        });
    }

    function RenderTable(data) {
        if ($.fn.DataTable.isDataTable('#tblReport')) {
            $('#tblReport').DataTable().destroy();
        }

        $('#tblReport').DataTable({
            scrollY: "60vh",
            scrollCollapse: true,
            scrollX: true,
            aaData: data,
            paging: false,
            searching: true,
            bInfo: true,
            language: {
                emptyTable: (!data || data.length === 0) ? "กรุณาระบุเงื่อนไขแล้วกดปุ่มค้นหาข้อมูล" : "ไม่พบข้อมูลตามเงื่อนไขที่ค้นหา",
                info: "แสดงทั้งหมด _TOTAL_ รายการ",
                infoEmpty: "แสดง 0 รายการ",
                infoFiltered: "(กรองจากทั้งหมด _MAX_ รายการ)",
                search: "ค้นหาในตาราง:"
            },
            order: [[1, "asc"]],
            drawCallback: function (settings) {
                var api = this.api();
                api.column(0, { search: 'applied', order: 'applied' }).nodes().each(function (cell, i) {
                    cell.innerHTML = i + 1;
                });
            },
            columns: [
                {
                    data: null,
                    className: "text-center font-bold",
                    orderable: false,
                    searchable: false,
                    render: function (data, type, row, meta) {
                        return meta.row + 1;
                    }
                },
                {
                    data: "createdate",
                    className: "text-center",
                    render: function (data, type, row) {
                        var rawDate = row && row.createdate_formatted ? row.createdate_formatted : (data && data.date ? data.date : data);
                        if (!rawDate) return "-";
                        if (type === "sort" || type === "type") {
                            return moment(rawDate).isValid() ? moment(rawDate).format('YYYYMMDD') : rawDate;
                        }
                        return FormatThaiShortDate(rawDate);
                    }
                },
                {
                    data: "c_no",
                    className: "text-center font-mono",
                    render: function (data) { return data ? data : "-"; }
                },
                {
                    data: "h_no",
                    className: "text-center font-mono",
                    render: function (data) { return data ? data : "-"; }
                },
                {
                    data: "weight",
                    className: "text-right font-mono",
                    render: function (data) {
                        if (data === null || data === undefined || data === "") return "-";
                        var num = Number(data);
                        return isNaN(num) ? data : num.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                    }
                },
                {
                    data: "sno",
                    className: "text-center font-bold text-red-600",
                    render: function (data) { return data ? data : "-"; }
                },
                {
                    data: null,
                    className: "text-center",
                    render: function () { return "-"; } // เลขที่คำร้องขอซื้อดวงตราตะกั่ว
                },
                {
                    data: "uf_doc_no",
                    className: "text-center font-mono",
                    render: function (data) { return data ? data : "-"; }
                },
                {
                    data: "po_line",
                    className: "text-center font-mono",
                    render: function (data) { return (data !== null && data !== undefined) ? data : "-"; }
                },
                {
                    data: "description",
                    className: "text-left",
                    render: function (data) { return data ? data : "-"; }
                }
            ],
            dom: "<'row'<'col-md-7'B><'col-md-5 text-right'f>>" +
                "<'row'<'col-md-12'tr>>" +
                "<'row'<'col-md-12 text-left'i>>",
            buttons: [
                {
                    extend: 'print',
                    text: "<i class='fa fa-print'></i>&nbsp;Print",
                    title: 'รายงานนำสินค้าขาเข้า'
                },
                {
                    extend: 'excel',
                    text: "<i class='fa fa-file-excel-o'></i>&nbsp;Excel",
                    title: 'รายงานนำสินค้าขาเข้า'
                },
                {
                    text: "<i class='fa fa-file-pdf-o'></i>&nbsp;พิมพ์รายงานนำสินค้าขาเข้า",
                    className: "btn-dt-pdf",
                    action: function () {
                        PrintPdfIn();
                    }
                },
            ]
        });
    }

    // =========================================================================
    // Print PDF ขาเข้า: V_STS_custom_IN (10 columns, 25 rows/page)
    // =========================================================================
    function PrintPdfIn() {
        if (!g_reportData || g_reportData.length === 0) {
            $.alert("ไม่มีข้อมูลที่จะพิมพ์ PDF กรุณาค้นหาข้อมูลก่อน");
            return;
        }

        var startStr = $("#txtFromDate").val().trim();
        var endStr = $("#txtToDate").val().trim();
        var dateRangeText = GetThaiDateRangeText(startStr, endStr);

        var docPages = [];
        var rowsPerPage = 25;
        var totalItems = g_reportData.length;
        var pageCount = Math.max(1, Math.ceil(totalItems / rowsPerPage));

        for (var p = 0; p < pageCount; p++) {
            var pageData = g_reportData.slice(p * rowsPerPage, (p + 1) * rowsPerPage);
            var tableBody = [];

            // Table Header 10 Columns
            tableBody.push([
                { text: "ลำดับ", bold: true, alignment: "center", fontSize: 10, margin: [0, 4, 0, 4] },
                { text: "วันที่นำเข้า", bold: true, alignment: "center", fontSize: 9.5, margin: [0, 1, 0, 1] },
                { text: "Coil No.", bold: true, alignment: "center", fontSize: 10, margin: [0, 4, 0, 4] },
                { text: "H/N No.", bold: true, alignment: "center", fontSize: 10, margin: [0, 4, 0, 4] },
                { text: "น้ำหนัก Coil (Kg.)", bold: true, alignment: "center", fontSize: 9.5, margin: [0, 4, 0, 4] },
                { text: "STS No.", bold: true, alignment: "center", fontSize: 10, margin: [0, 4, 0, 4] },
                { text: "เลขที่คำร้องขอ\nซื้อดวงตราตะกั่ว", bold: true, alignment: "center", fontSize: 9.5, margin: [0, 1, 0, 1] },
                { text: "ใบขนสินค้าขาเข้าเลขที่", bold: true, alignment: "center", fontSize: 9.5, margin: [0, 4, 0, 4] },
                { text: "รายการที่", bold: true, alignment: "center", fontSize: 9.5, margin: [0, 4, 0, 4] },
                { text: "ชนิดของ", bold: true, alignment: "center", fontSize: 10, margin: [0, 4, 0, 4] },
            ]);

            // Table Rows (25 rows per page)
            for (var r = 0; r < rowsPerPage; r++) {
                var rowItem = pageData[r];
                var rowIdx = (p * rowsPerPage) + r + 1;

                if (rowItem) {
                    var dtStr = rowItem.createdate_formatted || (rowItem.createdate ? (rowItem.createdate.date || rowItem.createdate) : "");
                    var shortDt = FormatThaiShortDate(dtStr);

                    var weightStr = "";
                    if (rowItem.weight !== null && rowItem.weight !== undefined && rowItem.weight !== "") {
                        var nw = Number(rowItem.weight);
                        weightStr = isNaN(nw) ? String(rowItem.weight) : nw.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                    }

                    tableBody.push([
                        { text: String(rowIdx), alignment: "center", fontSize: 9.5 },
                        { text: shortDt, alignment: "center", fontSize: 9.5 },
                        { text: String(rowItem.c_no || "-"), alignment: "center", fontSize: 9.5 },
                        { text: String(rowItem.h_no || "-"), alignment: "center", fontSize: 9.5 },
                        { text: weightStr, alignment: "right", fontSize: 9.5 },
                        { text: String(rowItem.sno || "-"), alignment: "center", fontSize: 9.5 },
                        { text: "", alignment: "center", fontSize: 9.5 }, // เลขที่คำร้องขอซื้อดวงตราตะกั่ว
                        { text: String(rowItem.uf_doc_no || "-"), alignment: "center", fontSize: 9.5 },
                        { text: String(rowItem.po_line !== null && rowItem.po_line !== undefined ? rowItem.po_line : "-"), alignment: "center", fontSize: 9.5 },
                        { text: String(rowItem.description || "-"), alignment: "left", fontSize: 9.5 },
                    ]);
                } else {
                    // Empty row padding up to 25 rows
                    tableBody.push([
                        { text: String(rowIdx), alignment: "center", fontSize: 9.5 },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
                        { text: "", alignment: "center" },
