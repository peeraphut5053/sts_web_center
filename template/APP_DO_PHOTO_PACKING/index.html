<link href="template/APP_DO_PHOTO_PACKING/photo_gallery.css" rel="stylesheet">
<section id="packing-app" class="packing-app">
    <header class="packing-heading">
        <span class="packing-heading-icon"><i class="fa fa-camera" aria-hidden="true"></i></span>
        <div><h3>APP DO PHOTO PACKING</h3><p>Upload / Tag list</p></div>
    </header>
    <div id="packing-status" class="packing-status" role="status" aria-live="polite" hidden></div>
    <div id="content_upload" class="packing-content"></div>
    <div id="content_list" class="packing-content" hidden></div>
    <nav class="packing-tabs" aria-label="Photo packing">
        <button type="button" id="tab_upload" class="active" aria-selected="true"><i class="fa fa-cloud-upload" aria-hidden="true"></i> Upload</button>
        <button type="button" id="tab_list" aria-selected="false"><i class="fa fa-th-list" aria-hidden="true"></i> Tag list</button>
    </nav>
    <div class="modal packing-modal" id="ProductModal" tabindex="-1" role="dialog" aria-labelledby="packing-modal-title">
        <div class="modal-dialog modal-lg" role="document"><div class="modal-content">
            <div class="modal-header"><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button><h4 id="packing-modal-title">Tag image</h4></div>
            <div class="modal-body"><p id="packing-modal-feedback" class="text-danger" role="alert" hidden></p><img id="modal_img" alt="Tag image"><p id="packing-modal-empty" hidden>No image</p></div>
            <div class="modal-footer">
                <label class="btn btn-info packing-file-label"><i class="fa fa-upload" aria-hidden="true"></i> Upload<input class="packing-file-input" type="file" id="packing-modal-file" accept="image/jpeg,image/png,image/gif"></label>
                <button type="button" class="btn btn-danger" id="packing-delete-image"><i class="fa fa-trash" aria-hidden="true"></i> &#3621;&#3610;</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">&#3611;&#3636;&#3604;</button>
            </div>
        </div></div>
    </div>
</section>
<script src="template/APP_DO_PHOTO_PACKING/packing.js?v=20261019-4"></script>
