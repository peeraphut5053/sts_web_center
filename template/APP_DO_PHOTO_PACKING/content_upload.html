<div class="packing-upload-grid">
    <div class="packing-photos">
        <div class="packing-photo-card">
            <div class="packing-card-title"><span>01</span><h4>Upload Image 1</h4></div>
            <label class="packing-photo-picker" for="imgInp">
                <img id="file_name_1" src="template/APP_DO_PHOTO_PACKING/add-image.png" alt="Image 1">
                <span><i class="fa fa-camera" aria-hidden="true"></i> Upload Image 1</span>
                <input class="packing-file-input" id="imgInp" type="file" accept="image/jpeg,image/png,image/gif" data-slot="file_name_1" disabled>
            </label>
        </div>
        <div class="packing-photo-card">
            <div class="packing-card-title"><span>02</span><h4>Upload Image 2</h4></div>
            <label class="packing-photo-picker" for="imgInp2">
                <img id="file_name_2" src="template/APP_DO_PHOTO_PACKING/add-image.png" alt="Image 2">
                <span><i class="fa fa-camera" aria-hidden="true"></i> Upload Image 2</span>
                <input class="packing-file-input" id="imgInp2" type="file" accept="image/jpeg,image/png,image/gif" data-slot="file_name_2" disabled>
            </label>
        </div>
    </div>
    <div class="packing-details">
        <div class="packing-card-title"><span><i class="fa fa-barcode" aria-hidden="true"></i></span><h4>Tag barcode</h4></div>
        <form id="packing-tag-form">
            <label for="tag_id">Tag barcode</label>
            <div class="packing-scan-row"><input value="{tag_id}" type="text" inputmode="numeric" autocomplete="off" class="form-control" id="tag_id" placeholder="Enter barcode"><button type="submit" class="btn btn-info"><i class="fa fa-search" aria-hidden="true"></i> &#3588;&#3657;&#3609;&#3627;&#3634;</button></div>
            <button type="button" class="btn btn-default packing-clear" id="packing-clear-tag"><i class="fa fa-undo" aria-hidden="true"></i> Clear Tag barcode</button>
        </form>
        <div class="packing-detail-fields">
            <label for="LOTtxt">Lot</label><input readonly class="form-control" id="LOTtxt">
            <label for="username">User</label><input readonly class="form-control username_session" id="username">
            <label for="remark">&#3627;&#3617;&#3634;&#3618;&#3648;&#3627;&#3605;&#3640;</label>
            <input id="remark" class="form-control" list="packing-remarks" autocomplete="off" disabled>
            <datalist id="packing-remarks"><option value="สีข้างท่อไม่ชัด"></option><option value="มีเลข Sts_no มากกว่า 2 เบอร์"></option></datalist>
        </div>
    </div>
</div>
