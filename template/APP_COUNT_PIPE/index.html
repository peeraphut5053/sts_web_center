<script type="text/javascript">
  var username_session = GetUserProp("login_username");
  var canEditPipeCountDate = false;
  var pipeCountDateCsrf = null;
  $.getJSON('././module/APP_COUNT_PIPE/update-count-date.php', function (permissions) {
    canEditPipeCountDate = permissions.can_edit === true;
    pipeCountDateCsrf = permissions.csrf_token;
    if ($.fn.dataTable.isDataTable('#tblReportCountPipe')) {
      $('#tblReportCountPipe').DataTable().rows().invalidate().draw(false);
    }
  });

  $('#tblReportCountPipe').off('click.countDate', '.edit-count-date').on('click.countDate', '.edit-count-date', function () {
    if (!canEditPipeCountDate) return;
    var table = $('#tblReportCountPipe').DataTable();
    var row = table.row($(this).closest('tr'));
    var record = row.data();
    var rawDate = record.count_date && (record.count_date.date || record.count_date);
    var input = $('<input>', { type: 'date', class: 'form-control input-sm', 'aria-label': 'วันที่ตรวจนับ' }).val(rawDate ? String(rawDate).slice(0, 10) : '');
    var save = $('<button>', { type: 'button', class: 'btn btn-success btn-xs', text: 'บันทึก' });
    var cancel = $('<button>', { type: 'button', class: 'btn btn-default btn-xs', text: 'ยกเลิก' });
    $(this).closest('td').empty().append(input, save, ' ', cancel);
    cancel.on('click', function () { row.invalidate().draw(false); });
    save.on('click', function () {
      if (!input.val()) { input.focus(); return; }
      input.add(save).add(cancel).prop('disabled', true);
      $.ajax({
        type: 'POST', url: '././module/APP_COUNT_PIPE/update-count-date.php', dataType: 'json',
        data: { do_num: record.do_num, record_createdate: record.record_createdate, count_date: input.val(), csrf_token: pipeCountDateCsrf },
        success: function (result) {
          if (result.success) { ReportItemSearch(); }
          else { input.add(save).add(cancel).prop('disabled', false); $.alert(result.message || 'บันทึกไม่สำเร็จ'); }
        },
        error: function (xhr) {
          input.add(save).add(cancel).prop('disabled', false);
          $.alert(xhr.responseJSON && xhr.responseJSON.message || 'บันทึกไม่สำเร็จ');
        }
      });
    });
  });
  $("#btnSearchReportCountPipe").click(function () {
    ReportItemSearch();
  });

  function openImage(src) {
    var win = window.open(src, '_blank');
    win.focus();
  }

  $("#start_date_count_pipe,#end_date_count_pipe").datepicker({
    dateFormat: "yy-mm-dd",
  });

  $("#btnRemove").click(function () {
    $("#tblReportCountPipe").DataTable().clear().destroy();
  });

  function ReportItemSearch() {
    var OldHtml = $("#btnSearchReportCountPipe").html();
    var do_num = $("#do_num_count_pipe").val();
    var start_date = $("#start_date_count_pipe").val();
    var end_date = $("#end_date_count_pipe").val();


    if (do_num == "" && start_date == "" && end_date == "") {
      $.alert("กรุณาระบุเลขที่เอกสาร หรือช่วงวันที่");
      return false;
    }

    $("#btnSearchReportCountPipe").html("<i class='fa fa-spinner fa-spin'></i>");
    $("#tblReportCountPipe").loading();
    $("#tblReportCountPipe tfoot").remove();
    $.ajax({
      type: "POST",
      url: "././module/APP_COUNT_PIPE/data.php",
      dataType: "json",
      beforeSend: function () {
        $("#btnSearchReportCountPipe").html("<i class='fa fa-spinner fa-spin'>");
      },
      data: {
        load: "GetReportCountPipe",
        do_num: do_num,
        start_date: start_date,
        end_date: end_date,
        date_field: $("#count_pipe_date_field").val(),
      },
      success: function (data) {
        $("#tblReportCountPipe").DataTable().clear();
        $("#tblReportCountPipe").dataTable({
          aaData: data,
          paging: false,
          fixedHeader: true,
          destroy: true,
          processing: true,
          scrollY: "65vh",
          scrollCollapse: true,
          scrollX: true,
          select: true,
          select: {
            style: "single",
          },
          columnDefs: [
          ],
          columns: [
            {
              data: "do_num",
              className: "text-center",
            },
            {
              data: "qty_system_count",
              className: "text-center",
            },
            {
              data: "qty_human_count",
              className: "text-center",
            },
            {
              data: "path",
              className: "text-center",
              "render": function (data, type, row) {
                return '<button class="btn btn-info btn-sm" onclick="OpenModalCountPipeImg(\'' + row.do_num + '\')"><i class="fa fa-image"></i>&nbsp;รูปภาพ</button>';
                // return '<div style="display: flex; align-items: center; justify-content: center;"><img src="module/APP_COUNT_PIPE/view_file.php?file=' + encodeURIComponent(data) + '&v=' + Date.now() + '" style="width: 50px; height: 50px; " onclick="openImage(this.src)"></div>';
              }
            },
            {
              data: "count_date.date",
              defaultContent: "-",
              className: "text-center",
              render: function (data, type, row) {
                var value = data || (typeof row.count_date === "string" ? row.count_date : null);
                if (type === 'sort' || type === 'type') return value || '';
                var label = value ? moment(value).format('DD/MM/YYYY') : '-';
                return type === 'display' && canEditPipeCountDate
                  ? label + ' <button type="button" class="btn btn-default btn-xs edit-count-date">แก้ไข</button>'
                  : label;
              },
            },
            {
              data: "createdate.date",
              className: "text-center",
              render: function (data, type, row) {
                return moment(data).format("DD/MM/YYYY");
              },
            },
            {
              data: "user",
              className: "text-center",
            },
            {
              data: "remark",
              className: "text-center",
            },
          ],
          dom:
            "<'row'<'col-md-5'B><'col-md-7 text-right col-flt-page'lf>>" +
            "<'row'<'col-md-12'tr>>" +
            "<'row'<'col-md-5 text-left'i><'col-sm-7 text-right'p>>",
          buttons: [
            {
              extend: "print",
              text: "<i class='fa fa-print'></i>&nbsp;Print",
              title: "",
            },
            {
              extend: "excel",
              footer: true,
              text: "<i class='fa fa-file-excel'></i>&nbsp;Excel",
              title:
                "Report Count Pipe " + moment().format("DD-MM-YYYY HH:mm:ss"),
            },
          ]
        });

        $("#tblReportCountPipe").loading("stop");
        $("#btnSearchReportCountPipe").html(OldHtml);
      },
      error: function (e) {
        $("#tblReportCountPipe").loading("stop");
        $("#btnSearchReportCountPipe").html(OldHtml);
        console.log("There was an error with your request...");
        console.log("error: " + JSON.stringify(e));
      },
    });
  }

  function OpenModalCountPipeImg(do_num) {
    var tableImg = $('#tbItemCountPipeImg').DataTable({
      "columnDefs": [
        { "targets": '_all', "className": 'text-center' },
        { "targets": 0, "width": "200" },
        { "targets": 1, "width": "400" },
        { "targets": 2, "width": "200" },

      ],
      columns: [
        {
          data: "do_num",
          className: "text-center",
        },
        {
          data: "path",
          className: "text-center",
          "render": function (data, type, row) {
            return '<div style="display: flex; align-items: center; justify-content: center;"><img src="module/APP_COUNT_PIPE/view_file.php?file=' + encodeURIComponent(data) + '&v=' + Date.now() + '" style="width: 50px; height: 50px; " onclick="openImage(this.src)"></div>';
          }
        },
        {
          data: "user",
          className: "text-center",
        },
      ],
      paging: false,
      searching: false,
      select: false,
      destroy: true,
      dom:
        "<'row'<'col-md-5'B><'col-md-7 text-right col-flt-page'lf>>" +
        "<'row'<'col-md-12'tr>>" +
        "<'row'<'col-md-5 text-left'i><'col-sm-7 text-right'p>>",
      buttons: [

      ],
    });
    $.ajax({
      type: "POST",
      url: "././module/APP_COUNT_PIPE/data.php",
      dataType: "json",
      beforeSend: function () {
      },
      data: {
        load: "GetCountPipeImg",
        do_num: do_num,
      },
      success: function (data) {
        tableImg.clear();
        tableImg.rows.add(data).draw();
        $("#ModalCountPipeImg").modal("show");
      },
      error: function (e) {
        console.log("There was an error with your request...");
        console.log("error: " + JSON.stringify(e));
      },
    });
  }

</script>
